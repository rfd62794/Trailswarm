[project]
name = "pokeagent"
version = "0.1.0"
description = "An agent that plays Pokemon Red on its own through PyBoy"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dearpygui>=2.0",
    "mcp>=2.3.0",
    "pillow>=13.0.0",
    "pyboy>=2.0",
    "numpy>=1.26",
]

[project.scripts]
pokeagent = "pokeagent.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pokeagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
